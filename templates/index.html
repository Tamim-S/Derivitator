<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><u>DERIVITATOR</u></title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      padding: 40px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
      font-size: 18px;
    }

    .panel {
      background-color: #1e293b;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 250px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #475569;
      background-color: #334155;
      color: white;
      font-size: 18px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background-color: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #3b82f6;
    }

    button:disabled {
      background-color: #475569;
      cursor: default;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .math-box {
      background-color: #334155;
      padding: 20px;
      border-radius: 14px;
      font-size: 24px;
      font-family: monospace;
      min-height: 60px;
      display: flex;
      align-items: center;
      word-break: break-word;
    }

    .math-box.error {
      color: #fca5a5;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    .error-banner {
      color: #fca5a5;
      font-size: 15px;
      margin-top: 12px;
      min-height: 18px;
    }

    @media (max-width: 700px) {
      .output-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Derivitator</h1>
    <div class="subtitle">
      Interactive differentiation tool.
    </div>

    <div class="panel">
      <h2>Function Input</h2>

      <div class="input-row">
        <input type="text" id="functionInput" placeholder="Enter function, e.g. sin(x^2)">
        <button id="differentiateBtn">Differentiate</button>
      </div>
      <div class="error-banner" id="errorBanner"></div>
    </div>

    <div class="output-grid">
      <div class="panel">
        <h2>Original Function</h2>

        <div class="math-box" id="originalOutput">
          f(x) = x^2
        </div>
      </div>

      <div class="panel">
        <h2>Derivative Function</h2>

        <div class="math-box" id="derivativeOutput">
          f'(x) = 2x
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('functionInput');
    const button = document.getElementById('differentiateBtn');
    const originalBox = document.getElementById('originalOutput');
    const derivativeBox = document.getElementById('derivativeOutput');
    const errorBanner = document.getElementById('errorBanner');

    async function differentiate() {
      const raw = input.value.trim();
      errorBanner.textContent = '';
      originalBox.classList.remove('error');
      derivativeBox.classList.remove('error');

      if (!raw) {
        errorBanner.textContent = 'Please enter a function of x.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Differentiating…';

      try {
        const response = await fetch('/differentiate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ function: raw }),
        });

        const data = await response.json();

        if (data.success) {
          originalBox.textContent = `f(x) = ${data.original}`;
          derivativeBox.textContent = `f'(x) = ${data.derivative}`;
        } else {
          errorBanner.textContent = data.error || 'Could not differentiate that function.';
        }
      } catch (err) {
        errorBanner.textContent = 'Could not reach the server. Is app.py running?';
      } finally {
        button.disabled = false;
        button.textContent = 'Differentiate';
      }
    }

    button.addEventListener('click', differentiate);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') differentiate();
    });
  </script>
</body>
</html>
